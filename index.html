<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unwanted Network</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="intro">
      <div class="intro-canvas">
        <img
          class="intro__frame"
          src="assets/images/intro/figma-intro-frame.png"
          alt="Unwanted Network intro"
        />
        <img
          class="intro__cat"
          src="assets/images/intro/character-cat.png"
          alt=""
        />
          <span class="intro__slogan-crop" aria-hidden="true">
            <img src="assets/images/intro/figma-intro-frame.png" alt="" />
          </span>
        <a
          class="intro__hotspot intro__hotspot--about"
          href="#campaign"
          aria-label="About campaign"
        ></a>
        <a
          class="intro__hotspot intro__hotspot--enter"
          href="#network"
          aria-label="Enter the network"
        ></a>
      </div>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
