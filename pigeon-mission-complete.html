<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAGGY — Pigeon Mission Complete</title>
    <link rel="stylesheet" href="css/pigeon-mission-complete.css" />
    <script src="js/pigeon-mission-complete.js" defer></script>
    <link rel="stylesheet" href="css/common-cursor.css" />
    <script src="js/common-cursor.js" defer></script>
  </head>
  <body>
    <main class="complete-canvas" aria-label="Pigeon Mission Complete">
      <img class="complete-layer complete-bg" src="assets/images/pigeon-mission-complete/pigeon-mission-complete-bg.png" alt="" />
      <a class="complete-layer complete-back" href="crew-select.html" aria-label="Crew Select로 돌아가기"><img src="assets/images/pigeon-mission-complete/pigeon-mission-complete-back-button.png" alt="" /></a>
      <img class="complete-layer complete-title" src="assets/images/pigeon-mission-complete/pigeon-mission-complete-title.png" alt="MISSION COMPLETE!" />
      <section class="complete-layer reward-card card-one" aria-label="MISSION 01 — TASK CLEAR, 3/3 TRASH COLLECTED">
        <img class="card-disabled" src="assets/images/pigeon-mission-complete/pigeon-mission-complete-card-01-disabled.png" alt="" />
        <img class="card-active" src="assets/images/pigeon-mission-complete/pigeon-mission-complete-card-01-active.png" alt="" />
        <img class="card-stamp" src="assets/images/pigeon-mission-complete/pigeon-mission-complete-card-03-stamp.png" alt="" />
      </section>
      <section class="complete-layer reward-card card-two" aria-label="MISSION 02 — REWARD, PIGEON TAG, ZONE SECURED GET!">
        <img class="card-disabled" src="assets/images/pigeon-mission-complete/pigeon-mission-complete-card-02-disabled.png" alt="" />
        <img class="card-active" src="assets/images/pigeon-mission-complete/pigeon-mission-complete-card-02-active.png" alt="" />
        <img class="card-stamp" src="assets/images/pigeon-mission-complete/pigeon-mission-complete-card-03-stamp.png" alt="" />
      </section>
      <section class="complete-layer reward-card card-three" aria-label="MISSION 03 — SIGNAL UPDATE, 64 → 67, SIGNALS CLEARED +3">
        <img class="card-disabled" src="assets/images/pigeon-mission-complete/pigeon-mission-complete-card-03-disabled.png" alt="" />
        <img class="card-active" src="assets/images/pigeon-mission-complete/pigeon-mission-complete-card-03-active.png" alt="" />
        <img class="card-stamp" src="assets/images/pigeon-mission-complete/pigeon-mission-complete-card-03-stamp.png" alt="" />
      </section>
      <section class="complete-layer taggy-dialogue" hidden aria-label="TAGGY / 태기">
        <img src="assets/images/pigeon-mission-complete/pigeon-mission-complete-dialogue-box.png" alt="" />
        <div class="taggy-copy">
          <p>봤어? 버려진 흔적 하나가 메시지가 됐어.</p>
          <p>다음 벽은 아직 네 태그를 기다리고 있어!</p>
        </div>
      </section>
      <div class="complete-layer city-entrance" hidden inert>
        <a class="city-button" href="pigeon-city-recovery.html"><img src="assets/images/pigeon-mission-complete/pigeon-mission-complete-city-button.png" alt="VIEW CITY RECOVERY" /></a>
      </div>
    </main>
  </body>
</html>
