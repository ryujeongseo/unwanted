<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unwanted Network</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="intro">
      <div class="intro-canvas">
        <img
          class="intro__frame"
          src="assets/images/intro/intro_base.png"
          alt="Unwanted Network intro"
        />
        <span class="intro__logo-motion" aria-hidden="true">
          <img
            class="intro__logo-image"
            src="assets/images/intro/logo-unwanted.svg"
            alt=""
          />
        </span>
        <span class="intro__pigeon-motion" aria-hidden="true">
          <img
            class="intro__pigeon-image"
            src="assets/images/intro/character-pigeon.png"
            alt=""
          />
        </span>
        <span class="intro__character intro__character--rat">
          <img
            class="intro__rat-image"
            src="assets/images/intro/character-rat.png"
            alt=""
          />
        </span>
        <span class="intro__cat">
          <img
            class="intro__cat-image"
            src="assets/images/intro/character-cat.png"
            alt=""
          />
        </span>
        <span class="intro__slogan-crop" aria-hidden="true">
          <img
            src="assets/images/intro/figma-weneedcrew-uncropped.png"
            alt=""
          />
        </span>
        <img
          class="intro__click-to-enter"
          src="assets/images/intro/click_to_enter.png"
          alt="Click to enter"
        />
        <a
          class="intro__hotspot intro__hotspot--about"
          href="about.html"
          aria-label="About campaign"
        >
          <img
            class="intro__about-image"
            src="assets/images/intro/aboutcampaign.png"
            alt="About campaign"
          />
        </a>
        <a
          class="intro__hotspot intro__hotspot--enter"
          href="crew-select.html"
          aria-label="Enter the network"
        >
          <img
            class="intro__enter-image"
            src="assets/images/intro/enter.png"
            alt="Enter the network"
          />
        </a>
      </div>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
