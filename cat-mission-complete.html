<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DASH — Cat Mission Complete</title>
    <link rel="stylesheet" href="css/cat-mission-complete.css" />
    <script src="js/cat-mission-complete.js" defer></script>
    <link rel="stylesheet" href="css/common-cursor.css" />
    <script src="js/common-cursor.js" defer></script>
  </head>
  <body>
    <main class="complete-canvas" aria-label="Cat Mission Complete">
      <img
        class="complete-layer complete-bg"
        src="assets/images/pigeon-mission-complete/pigeon-mission-complete-bg.png"
        alt=""
      />
      <a
        class="complete-layer complete-back"
        href="crew-select.html"
        aria-label="Crew Select로 돌아가기"
        ><img
          src="assets/images/pigeon-mission-complete/pigeon-mission-complete-back-button.png"
          alt=""
      /></a>
      <img
        class="complete-layer complete-title"
        src="assets/images/pigeon-mission-complete/pigeon-mission-complete-title.png"
        alt="MISSION COMPLETE!"
      />
      <section
        class="complete-layer reward-card card-one"
        aria-label="MISSION 01 — TASK CLEAR, 3/3 TRASH COLLECTED"
      >
        <img
          class="card-disabled"
          src="assets/images/cat-mission-complete/cat-mission-complete-card-01-disabled.png"
          alt=""
        />
        <img
          class="card-active"
          src="assets/images/cat-mission-complete/cat-mission-complete-card-01-active.png"
          alt=""
        />
        <img
          class="card-stamp"
          src="assets/images/cat-mission-complete/cat-mission-complete-card-03-stamp.png"
          alt=""
        />
      </section>
      <section
        class="complete-layer reward-card card-two"
        aria-label="MISSION 02 — REWARD, CAT TAG, ZONE SECURED GET!"
      >
        <img
          class="card-disabled"
          src="assets/images/cat-mission-complete/cat-mission-complete-card-02-disabled.png"
          alt=""
        />
        <img
          class="card-active"
          src="assets/images/cat-mission-complete/cat-mission-complete-card-02-active.png"
          alt=""
        />
        <img
          class="card-stamp"
          src="assets/images/cat-mission-complete/cat-mission-complete-card-03-stamp.png"
          alt=""
        />
      </section>
      <section
        class="complete-layer reward-card card-three"
        aria-label="MISSION 03 — SIGNAL UPDATE, 64 → 67, SIGNALS CLEARED +3"
      >
        <img
          class="card-disabled"
          src="assets/images/cat-mission-complete/cat-mission-complete-card-03-disabled.png"
          alt=""
        />
        <img
          class="card-active"
          src="assets/images/cat-mission-complete/cat-mission-complete-card-03-active.png"
          alt=""
        />
        <img
          class="card-stamp"
          src="assets/images/cat-mission-complete/cat-mission-complete-card-03-stamp.png"
          alt=""
        />
      </section>
      <section
        class="complete-layer dash-dialogue"
        hidden
        aria-label="DASH / 대시"
      >
        <img
          src="assets/images/cat-mission-complete/cat-mission-complete-dialogue-box.png"
          alt=""
        />
        <div class="dash-copy">
          <p>봤지? 숨은 길 하나가 밝혀졌어.</p>
          <p>다음 사각지대가 널 기다려!</p>
        </div>
      </section>
      <div class="complete-layer city-entrance" hidden inert>
        <a class="city-button" href="cat-city-recovery.html"
          ><img
            src="assets/images/pigeon-mission-complete/pigeon-mission-complete-city-button.png"
            alt="VIEW CITY RECOVERY"
        /></a>
      </div>
    </main>
  </body>
</html>
